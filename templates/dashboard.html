{% extends "base.html" %}{% block content %}
<div id="empty"></div>
<div id="dash" class="d-none">
  <div class="row g-3 mb-3" id="kpis"></div>
  <div class="row g-3 mb-3">
    <div class="col-lg-7"><div class="card-np"><h2>Network health over time <span class="sim-tag">simulated</span></h2><div style="height:250px"><canvas id="cHealth"></canvas></div></div></div>
    <div class="col-lg-5"><div class="card-np"><h2>Path latency &amp; throughput <span class="sim-tag">simulated</span></h2><div style="height:250px"><canvas id="cLat"></canvas></div></div></div>
  </div>
  <div class="row g-3">
    <div class="col-lg-4"><div class="card-np"><h2>Recent alerts</h2><div id="alerts"></div></div></div>
    <div class="col-lg-4"><div class="card-np"><h2>Recent activity</h2><div id="feed"></div></div></div>
    <div class="col-lg-4"><div class="card-np"><h2>Topology overview</h2><div id="topologySummary"></div>
      <div class="mt-3 small text-secondary">Simulated packet loss: <b id="loss"></b>%</div></div></div>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>{% endblock %}
